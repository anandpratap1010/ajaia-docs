services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ajaia_docs
      POSTGRES_USER: ajaia
      POSTGRES_PASSWORD: ajaia_local
    volumes:
      - ajaia_postgres:/var/lib/postgresql/data
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ajaia -d ajaia_docs"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://ajaia:ajaia_local@postgres:5432/ajaia_docs
      JWT_SECRET_KEY: local-docker-secret-change-for-production
      CORS_ORIGINS: http://localhost:5173
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports: ["5173:5173"]
    depends_on: [backend]
volumes:
  ajaia_postgres:
